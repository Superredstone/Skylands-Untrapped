[workspace]
resolver = "2"
members = [
    "crates/skylands-formats",
    "crates/skylands-portal",
    "crates/skylands-extractor",
    "crates/skylands-app",
]

[workspace.dependencies]
thiserror = "2.0"
byteorder = "1.5"
log = "0.4"
env_logger = "0.11"
hidapi = "2.6"
clap = { version = "4.5", features = ["derive"] }
crc32fast = "1.4"
