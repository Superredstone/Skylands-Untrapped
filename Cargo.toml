[workspace]
resolver = "2"
members = [
    "crates/skylands-formats",
    "crates/skylands-portal",
    "crates/skylands-extractor",
    "crates/skylands-render",
    "crates/skylands-core",
    "crates/skylands-app",
]

[workspace.dependencies]
thiserror = "2.0"
byteorder = "1.5"
log = "0.4"
env_logger = "0.11"
hidapi = "2.6"
clap = { version = "4.5", features = ["derive"] }
crc32fast = "1.4"
wgpu = "24"
winit = "0.30"
bytemuck = { version = "1.21", features = ["derive"] }
gilrs = "0.11"
rodio = "0.20"
pollster = "1.0"
skylands-formats = { path = "crates/skylands-formats" }
skylands-portal = { path = "crates/skylands-portal" }
skylands-extractor = { path = "crates/skylands-extractor" }
skylands-render = { path = "crates/skylands-render" }
skylands-core = { path = "crates/skylands-core" }
